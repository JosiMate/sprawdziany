# Buduje stronę MkDocs i publikuje ją na GitHub Pages.
#
# Warunek działania: w repozytorium wejdź w Settings → Pages i ustaw
# Source na "GitHub Actions". Bez tego workflow zbuduje stronę, ale
# krok wdrożenia zakończy się błędem.

name: Publikacja strony

on:
  push:
    branches: [main]
  workflow_dispatch:        # pozwala uruchomić ręcznie z zakładki Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Jedno wdrożenie naraz. Nie przerywamy trwającego — niedokończone
# wdrożenie mogłoby zostawić stronę w stanie pośrednim.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Zbuduj
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v7

      - name: Przygotuj Pythona
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Zainstaluj zależności
        run: pip install -r requirements.txt

      - name: Zbuduj stronę
        run: mkdocs build --strict

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v6

      - name: Wyślij zbudowaną stronę jako artefakt
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Opublikuj
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wdróż na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
